[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyspark-retail-data-lakehouse"
version = "0.1.0"
description = "Production-style PySpark medallion pipeline for retail analytics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyspark>=3.5,<3.6",
  "delta-spark>=3.2,<3.3",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
